name: Build and Release NerdQAxePlus2 480x320 Firmware

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      BOARD: NERDQAXEPLUS2
      BIGSCREEN: "1"
      FIRMWARE_BIN: esp-miner-NerdQAxe++.bin
      FACTORY_BIN: esp-miner-factory-NERDQAXEPLUS2.bin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Get version tag
      run: |
        git fetch --tags
        version=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        echo "VERSION_TAG=${version}" >> "$GITHUB_ENV"

    - name: Insert web UI version
      run: |
        commit_hash=$(git rev-parse --short HEAD)
        sed -i "s|__COMMIT__|${commit_hash}|g" ./main/http_server/axe-os/src/app/app.module.ts
        sed -i "s|__VERSION__|${VERSION_TAG}|g" ./main/http_server/axe-os/src/app/app.module.ts
        for lang in de en es fr it pl ro; do
          if [ -f "./main/http_server/axe-os/src/assets/i18n/${lang}.json" ]; then
            mv "./main/http_server/axe-os/src/assets/i18n/${lang}.json" "./main/http_server/axe-os/src/assets/i18n/${lang}.${commit_hash}.json"
          fi
        done

    - name: Set target
      run: |
        docker run --rm --user root \
          -e BOARD="${BOARD}" \
          -e BIGSCREEN="${BIGSCREEN}" \
          -v "$PWD":/home/builder/project \
          shufps/esp-idf-builder:0.0.1 \
          idf.py set-target esp32s3

    - name: Compile binaries
      run: |
        docker run --rm --user root \
          -e BOARD="${BOARD}" \
          -e BIGSCREEN="${BIGSCREEN}" \
          -v "$PWD":/home/builder/project \
          shufps/esp-idf-builder:0.0.1 \
          idf.py build

    - name: Prepare release assets
      run: |
        cp build/esp-miner.bin "build/${FIRMWARE_BIN}"
        docker run --rm --user root \
          -v "$PWD":/home/builder/project \
          shufps/esp-idf-builder:0.0.1 \
          esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m \
          0x0 build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x10000 build/esp-miner.bin \
          0x410000 build/www.bin \
          0xf10000 build/ota_data_initial.bin \
          -o "build/${FACTORY_BIN}"
        {
          echo "<!--"
          sha256sum "build/${FACTORY_BIN}" "build/${FIRMWARE_BIN}" build/www.bin
          echo "-->"
        } > release-checksums.md

    - name: Upload to release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/${{ env.FACTORY_BIN }}
          build/${{ env.FIRMWARE_BIN }}
          build/www.bin
        tag_name: ${{ env.VERSION_TAG }}
        append_body: true
        body_path: release-checksums.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Cloudflare R2
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      run: |
        if [ -z "${RCLONE_CONF:-}" ]; then
          echo "RCLONE_CONF not set; skipping R2 upload."
          exit 0
        fi

        curl -fsSL https://rclone.org/install.sh | sudo bash
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

        target_dir="webflasher/${VERSION_TAG}"
        rclone copyto "build/${FACTORY_BIN}" "r2:${target_dir}/${FACTORY_BIN}" --s3-acl public-read
        rclone copyto "build/${FIRMWARE_BIN}" "r2:${target_dir}/${FIRMWARE_BIN}" --s3-acl public-read
        rclone copyto build/www.bin "r2:${target_dir}/www.bin" --s3-acl public-read
